<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 664" width="300" height="664">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5240"/>
      <stop offset="0.55" stop-color="#5E3B2E"/>
      <stop offset="1" stop-color="#43281F"/>
    </linearGradient>
    <linearGradient id="hairTop" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#8C6350"/>
      <stop offset="1" stop-color="#64402F"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEBDE"/>
      <stop offset="1" stop-color="#F9D2BE"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFBFCB"/>
      <stop offset="1" stop-color="#F28BA2"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F2F6FC"/>
      <stop offset="1" stop-color="#DDE5F2"/>
    </linearGradient>
    <linearGradient id="stocking" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EEF8"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF9BAE" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FF9BAE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 后发：披肩长发 -->
  <path d="M150 44 C 92 44 76 92 78 144 C 80 208 68 262 62 318 C 58 356 74 384 90 392 C 104 398 118 396 130 392 L 170 392 C 182 396 196 398 210 392 C 226 384 242 356 238 318 C 232 262 220 208 222 144 C 224 92 208 44 150 44 Z"
        fill="url(#hair)"/>

  <!-- 腿：左右分开，中间留缝，避免粘连 -->
  <path d="M106 386 L105 566 C 104 586 112 600 126 600 C 140 600 148 586 147 566 L 148 386 Z" fill="url(#skin)"/>
  <path d="M152 386 L153 566 C 152 586 160 600 174 600 C 188 600 196 586 195 566 L 194 386 Z" fill="url(#skin)"/>
  <!-- 腿内侧阴影与外侧高光 -->
  <path d="M143 400 L142 560" stroke="#EFB49C" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M157 400 L158 560" stroke="#EFB49C" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    
  <!-- 白袜 -->
  <path d="M105 540 L104 566 C 104 586 112 600 126 600 C 140 600 148 586 147 566 L 148 540 Z" fill="url(#stocking)"/>
  <path d="M152 540 L153 566 C 152 586 160 600 174 600 C 188 600 196 586 195 566 L 194 540 Z" fill="url(#stocking)"/>
  <path d="M105 540 L148 540 L148 550 L105 550 Z" fill="#FFFFFF"/>
  <path d="M152 540 L194 540 L194 550 L152 550 Z" fill="#FFFFFF"/>

  <!-- 鞋 -->
  <path d="M102 586 L102 606 C 102 620 112 628 127 628 C 142 628 148 619 146 606 L 146 586 Z" fill="#F49BB0"/>
  <path d="M198 586 L198 606 C 198 620 188 628 173 628 C 158 628 152 619 154 606 L 154 586 Z" fill="#F49BB0"/>
  <path d="M102 616 C 102 624 112 628 127 628 C 142 628 148 622 146 614 Z" fill="#E4819A" opacity="0.5"/>
  <path d="M198 616 C 198 624 188 628 173 628 C 158 628 152 622 154 614 Z" fill="#E4819A" opacity="0.5"/>

  <!-- 裙子：百褶短裙 -->
  <path d="M108 316 L192 316 L216 428 C 194 442 106 442 84 428 Z" fill="url(#skirt)"/>
  <g stroke="#CBD7E8" stroke-width="2.5" opacity="0.85" fill="none">
    <path d="M126 320 L112 434"/>
    <path d="M140 320 L132 438"/>
    <path d="M160 320 L168 438"/>
    <path d="M174 320 L188 434"/>
  </g>
  <path d="M108 316 L192 316 L194 330 L106 330 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- 躯干：粉色短袖 T 恤 -->
  <path d="M150 166 C 132 166 116 172 106 182 C 98 190 94 202 92 216 L 88 300 L 106 304 L 110 262 L 110 328 L 190 328 L 190 262 L 194 304 L 212 300 L 208 216 C 206 202 202 190 194 182 C 184 172 168 166 150 166 Z"
        fill="url(#shirt)"/>
  <!-- 领口 -->
  <path d="M132 168 C 138 180 162 180 168 168 C 162 164 138 164 132 168 Z" fill="#E97D95"/>
  <!-- 胸前白色小菱形标识 -->
  <path d="M150 214 L 163 231 L 150 248 L 137 231 Z" fill="#FFFFFF" opacity="0.92"/>
  <!-- 衣褶 -->
  <g stroke="#E57E96" stroke-width="2.5" opacity="0.45" fill="none">
    <path d="M118 300 L120 326"/>
    <path d="M182 300 L180 326"/>
  </g>

  <!-- 手臂 -->
  <path d="M108 186 C 98 190 92 200 90 214 L 84 300 C 83 312 90 320 99 320 C 108 320 113 313 113 302 L 118 214 Z" fill="url(#skin)"/>
  <path d="M192 186 C 202 190 208 200 210 214 L 216 300 C 217 312 210 320 201 320 C 192 320 187 313 187 302 L 182 214 Z" fill="url(#skin)"/>
  <!-- 短袖袖口 -->
  <path d="M105 182 C 96 188 91 198 90 210 L 114 216 L 120 188 Z" fill="url(#shirt)"/>
  <path d="M195 182 C 204 188 209 198 210 210 L 186 216 L 180 188 Z" fill="url(#shirt)"/>

  <!-- 脖子 -->
  <path d="M136 146 L164 146 L164 172 C 164 180 136 180 136 172 Z" fill="#F6C8B4"/>

  <!-- 脸 -->
  <path d="M150 62 C 116 62 108 88 108 118 C 108 150 124 180 150 180 C 176 180 192 150 192 118 C 192 88 184 62 150 62 Z" fill="url(#skin)"/>

  <!-- 耳朵 -->
  <ellipse cx="107" cy="124" rx="7" ry="10" fill="#F9D2BE"/>
  <ellipse cx="193" cy="124" rx="7" ry="10" fill="#F9D2BE"/>

  <!-- 腮红 -->
  <ellipse cx="123" cy="141" rx="12" ry="8" fill="url(#cheek)"/>
  <ellipse cx="177" cy="141" rx="12" ry="8" fill="url(#cheek)"/>

  <!-- 眼睛 -->
  <g>
    <ellipse cx="128" cy="123" rx="9.6" ry="11" fill="#FFFFFF"/>
    <ellipse cx="172" cy="123" rx="9.6" ry="11" fill="#FFFFFF"/>
    <ellipse cx="129" cy="124" rx="7.4" ry="8.8" fill="#4A3026"/>
    <ellipse cx="171" cy="124" rx="7.4" ry="8.8" fill="#4A3026"/>
    <ellipse cx="129" cy="126" rx="3.9" ry="4.6" fill="#231512"/>
    <ellipse cx="171" cy="126" rx="3.9" ry="4.6" fill="#231512"/>
    <circle cx="126" cy="119" r="2.8" fill="#FFFFFF"/>
    <circle cx="168" cy="119" r="2.8" fill="#FFFFFF"/>
    <circle cx="132" cy="129" r="1.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="174" cy="129" r="1.5" fill="#FFFFFF" opacity="0.7"/>
    <!-- 睫毛 -->
    <path d="M118 115 Q 128 107 139 115" stroke="#3A241C" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M161 115 Q 172 107 182 115" stroke="#3A241C" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 眉毛 -->
  <path d="M120 103 Q 128 98 138 102" stroke="#6B4636" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M162 102 Q 172 98 180 103" stroke="#6B4636" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- 嘴 -->
  <path d="M144 154 Q 150 162 156 154" stroke="#D9707F" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 前发：齐刘海 + 两侧发绺 -->
  <path d="M150 54 C 112 54 102 82 102 116 C 102 122 104 128 106 132 C 108 120 110 108 116 100 C 126 106 138 108 150 108 C 162 108 174 106 184 100 C 190 108 192 120 194 132 C 196 128 198 122 198 116 C 198 82 188 54 150 54 Z"
        fill="url(#hairTop)"/>
  <path d="M102 112 C 96 148 98 178 104 200 C 110 218 118 226 122 224 C 116 200 114 168 116 138 Z" fill="url(#hair)"/>
  <path d="M198 112 C 204 148 202 178 196 200 C 190 218 182 226 178 224 C 184 200 186 168 184 138 Z" fill="url(#hair)"/>
  <!-- 发丝高光 -->
  <path d="M124 74 C 116 84 112 96 112 108" stroke="#A57962" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M170 72 C 180 82 186 96 186 110" stroke="#A57962" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- 发饰：麻将牌造型小发夹 -->
  <g transform="translate(186 74) rotate(18)">
    <rect x="-16" y="-20" width="32" height="40" rx="6" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="2"/>
    <text x="0" y="12" font-family="serif" font-size="26" font-weight="bold" fill="#D64545" text-anchor="middle">發</text>
  </g>
</svg>
